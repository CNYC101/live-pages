<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>菜鸟云仓 · 商家全流程操作指南</title>
<style>
  :root{
    --brand:#1E6FFF; --brand-d:#0B4FD1; --accent:#00C2A8; --warn:#FF7A45;
    --bg:#F5F7FB; --card:#FFFFFF; --ink:#1D2129; --ink-2:#4E5969; --ink-3:#86909C;
    --line:#E5E9F0; --chip:#EEF3FF; --radius:16px;
    --shadow:0 6px 24px rgba(20,40,80,.06); --shadow-h:0 10px 34px rgba(20,40,80,.12);
    --hh:66px;   /* header height */
    --sh:70px;   /* stage bar height */
    --maxw:1200px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--brand);text-decoration:none}

  /* header */
  header.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line)}
  .site-in{max-width:var(--maxw);margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:14px;height:var(--hh)}
  .logo{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:var(--shadow)}
  .site-title{font-size:18px;font-weight:800;letter-spacing:.4px}
  .site-sub{font-size:12px;color:var(--ink-3);margin-top:-2px}
  .badge{margin-left:auto;font-size:12px;color:var(--brand);background:var(--chip);border:1px solid #d7e3ff;padding:5px 12px;border-radius:20px;font-weight:600}
  .draft-flag{font-size:12px;color:#9a6b00;background:#fff5db;border:1px solid #ffe1a6;padding:5px 12px;border-radius:20px;font-weight:600;margin-left:10px}

  /* top tabs */
  .tabs{max-width:var(--maxw);margin:0 auto;padding:16px 24px 0;display:flex;gap:8px;flex-wrap:wrap}
  .tab-btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:11px 20px;border-radius:12px 12px 0 0;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:none;position:relative}
  .tab-btn:hover{color:var(--brand)}
  .tab-btn.active{color:var(--brand);border-color:#cfe0ff}
  .tab-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--brand);border-radius:3px}
  .rec-badge{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff4d4f,#ff7875);border-radius:20px;padding:2px 9px;margin-left:2px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(255,77,79,.35)}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px 60px}
  .panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);box-shadow:var(--shadow)}
  .panel.active{display:block}

  /* sticky stage overview bar (frozen) */
  .stagebar{position:sticky;top:var(--hh);z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;min-height:var(--sh);display:flex;align-items:center;gap:10px;overflow-x:auto}
  .stagebar .lbl{font-size:12px;color:var(--ink-3);font-weight:700;flex:0 0 auto;letter-spacing:.5px}
  .stage-pill{flex:1 0 auto;display:flex;align-items:center;gap:10px;min-width:170px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;transition:.15s;background:#fff;position:relative}
  .stage-pill:hover{border-color:var(--brand);box-shadow:var(--shadow)}
  .stage-pill .ic{font-size:22px;line-height:1}
  .stage-pill .st{font-size:14px;font-weight:800}
  .stage-pill .sd{font-size:11px;color:var(--ink-3)}
  .stage-pill .idx{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:var(--shadow)}
  .stage-pill.active{background:linear-gradient(180deg,#f2f7ff,#e9f1ff);border-color:var(--brand)}
  .stage-sep{display:flex;align-items:center;color:#c4d0e8;font-size:20px;font-weight:800;flex:0 0 auto}
  .stage-sep:last-of-type{display:none}

  /* layout: toc + content */
  .layout{display:grid;grid-template-columns:250px 1fr}
  nav.toc{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:calc(var(--hh) + var(--sh));align-self:start;max-height:calc(100vh - var(--hh) - var(--sh) - 20px);overflow:auto}
  nav.toc .grp-h{font-size:12px;color:var(--brand);font-weight:800;padding:12px 10px 4px;display:flex;align-items:center;gap:6px}
  nav.toc .grp-h .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
  nav.toc a{display:block;font-size:13.3px;color:var(--ink-2);padding:7px 10px 7px 16px;border-radius:9px;line-height:1.4;border-left:2px solid transparent}
  nav.toc a:hover{background:#f3f6fc;color:var(--brand)}
  nav.toc a.active{background:#eef4ff;color:var(--brand);font-weight:700;border-left-color:var(--brand)}
  nav.toc a .pc-tag{color:var(--warn);font-weight:700;font-size:11px}

  main.body{padding:24px 30px 40px;min-width:0}
  .stage-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;padding:14px 16px;background:linear-gradient(90deg,#eef4ff,#f7faff);border:1px solid #e0ebff;border-radius:12px;scroll-margin-top:calc(var(--hh) + var(--sh) + 12px)}
  .stage-head .sh-ic{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .stage-head .sh-t{font-size:18px;font-weight:800}
  .stage-head .sh-s{font-size:12.5px;color:var(--ink-3)}
  .stage-head:not(:first-child){margin-top:34px}

  section.mod{padding-bottom:14px;margin:8px 0 6px;scroll-margin-top:calc(var(--hh) + var(--sh) + 12px)}
  .mod-h{display:flex;align-items:center;gap:12px;margin:2px 0 4px}
  .mod-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--chip);display:grid;place-items:center;font-size:20px}
  .mod-h h2{font-size:18px;margin:0;font-weight:800}
  .mod-h .kicker{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .mod-desc{font-size:13.5px;color:var(--ink-2);margin:4px 0 10px}

  .step{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin:11px 0;background:#fff;transition:.15s}
  .step:hover{box-shadow:var(--shadow)}
  .step-h{display:flex;align-items:flex-start;gap:10px}
  .step-n{font-size:12px;font-weight:800;color:var(--brand);background:var(--chip);border-radius:8px;padding:3px 9px;white-space:nowrap}
  .step-t{font-size:15px;font-weight:700;margin:0}
  .step-d{font-size:13.5px;color:var(--ink-2);margin:8px 0 0}
  .step-d ul{margin:6px 0 0;padding-left:20px}
  .step-d li{margin:3px 0}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:20px;padding:4px 11px;margin-left:auto;white-space:nowrap}
  .chip-pc{color:#fff;background:var(--warn);cursor:pointer}
  .chip-pc:hover{filter:brightness(.94)}
  .chip-todo{color:#7a5a00;background:#fff3d1}
  .rels{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .rels .rl-lbl{font-size:12px;color:var(--ink-3)}
  .rel{font-size:12.5px;color:var(--brand);background:#f0f5ff;border:1px solid #d7e3ff;border-radius:20px;padding:3px 11px;cursor:pointer}
  .rel:hover{background:#e2ecff}

  /* 真实截图（点击放大） */
  .th{position:relative;border:1px solid var(--line);border-radius:12px;background:#eef2f8;overflow:hidden;cursor:zoom-in;transition:.15s;aspect-ratio:16/10}
  .th:hover{border-color:var(--brand);box-shadow:var(--shadow-h);transform:translateY(-2px)}
  .th .sk{position:absolute;inset:0;z-index:0;display:grid;place-items:center;font-size:12px;color:#a4b0c4;background:linear-gradient(100deg,#eef2f8 30%,#f7faff 50%,#eef2f8 70%);background-size:200% 100%;animation:shimmer 1.3s infinite linear}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .th img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;background:transparent}
  .th.ld .sk{display:none}
  .th .n{position:absolute;left:8px;top:8px;z-index:2;background:rgba(29,33,41,.72);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
  .th .mag{position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(30,111,255,.9);color:#fff;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;opacity:0;transition:.15s}
  .th:hover .mag{opacity:1}
  /* 截图直接跟在所属步骤文字下方 */
  .step-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
  .gal-cap{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:600;margin:16px 0 2px}
  .gal-cap .z{color:var(--brand)}

  .tip{display:flex;gap:10px;background:#f2f7ff;border:1px solid #d7e6ff;border-radius:12px;padding:12px 15px;margin:14px 0;font-size:13px;color:#274a86}
  .tip .e{font-size:17px}
  .tip.warn{background:#fff6f0;border-color:#ffd9c2;color:#8a4718}

  /* 外部资源链接 chips */
  .lnk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--brand);background:#f0f5ff;border:1px solid #d7e3ff;border-radius:20px;padding:4px 12px;text-decoration:none;transition:.15s;white-space:nowrap}
  .lnk:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mod-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f7faff;border:1px dashed #cfe0ff;border-radius:12px;padding:10px 14px;margin:6px 0 4px}
  .mod-links .ml-lbl{font-size:12.5px;color:var(--ink-3);font-weight:700}
  .step-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .mod-login{margin:6px 0 4px}
  .mod-login .lnk{font-size:13.5px;padding:8px 16px;background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--shadow)}
  .mod-login .lnk:hover{background:var(--brand-d);border-color:var(--brand-d)}
  .step-qr{display:flex;align-items:center;gap:16px;margin-top:12px;background:linear-gradient(90deg,#f2f7ff,#f7faff);border:1px solid #d7e6ff;border-radius:12px;padding:14px 16px}
  .step-qr .qr-th{width:150px;flex:0 0 150px;aspect-ratio:1/1;background:#fff}
  .step-qr .qr-txt{font-size:14px;color:#274a86;font-weight:700}
  .step-qr .qr-txt .qr-sub{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:5px}
  @media (max-width:520px){.step-qr{flex-direction:column;align-items:flex-start}}

  /* FAQ */
  .faq{padding:24px 30px 40px}
  .faq-h{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .faq-h .bar{width:4px;height:18px;background:var(--brand);border-radius:2px}
  .faq-item{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:#fff}
  .faq-q{width:100%;text-align:left;appearance:none;border:none;background:none;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
  .faq-q:hover{color:var(--brand)}
  .faq-q .arw{transition:.2s;color:var(--ink-3)}
  .faq-a{display:none;padding:0 18px 16px;color:var(--ink-2);font-size:14px}
  .faq-item.open .faq-a{display:block}
  .faq-item.open .faq-q .arw{transform:rotate(180deg);color:var(--brand)}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(10,20,40,.82);display:none;place-items:center;z-index:100;padding:24px}
  .lb.show{display:grid}
  .lb img{max-width:92vw;max-height:86vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .cap{color:#dfe7f5;margin-top:12px;font-size:13px;text-align:center}
  .lb .x{position:absolute;top:20px;right:26px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:46px;cursor:pointer;line-height:1;user-select:none;padding:6px 16px;border-radius:12px;background:rgba(255,255,255,.08)}
  .lb .nav:hover{background:rgba(255,255,255,.2)}
  .lb .nav.prev{left:14px}
  .lb .nav.next{right:14px}

  footer{max-width:var(--maxw);margin:0 auto;padding:24px;color:var(--ink-3);font-size:12.5px;text-align:center}

  @media (max-width:820px){
    :root{--sh:62px}
    .layout{grid-template-columns:1fr}
    nav.toc{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
    nav.toc .grp-h{width:100%;padding:6px 8px}
    nav.toc a{padding:6px 10px;background:#f3f6fc;border-radius:20px;border-left:none}
    .step-imgs,.gal{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="site">
  <div class="site-in">
    <div class="logo" title="菜小鸟 logo（待替换为官方图标）">鸟</div>
    <div>
      <div class="site-title">菜鸟云仓 · 商家全流程操作指南</div>
      <div class="site-sub">从注册到发货对账，一步一图跟着做</div>
    </div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div id="panel-pc" class="panel active"></div>
  <div id="panel-mp" class="panel"></div>
  <div id="panel-faq" class="panel"></div>
</div>

<footer>菜鸟云仓 · 商家操作指南 —— 正文与截图取自源操作手册，每个步骤的截图直接跟在对应文字下方，点击可放大。结构、主色与 Logo 待最终确认。</footer>

<div class="lb" id="lb"><span class="x" onclick="closeLB()">×</span><span class="nav prev" onclick="lbStep(-1)">‹</span><div><img id="lbImg" alt=""/><div class="cap" id="lbCap"></div></div><span class="nav next" onclick="lbStep(1)">›</span></div>

<script>
/* ================= 4 阶段（第一次入仓动线） ================= */
const STAGES = [
  {id:'st1', ic:'🔑', name:'注册签约',      sub:'开账号 · 签合同'},
  {id:'st2', ic:'🔌', name:'ERP 对接',      sub:'店铺授权 · 商货品绑定'},
  {id:'st3', ic:'📥', name:'备货入仓',      sub:'建入库单 · 寄送到仓'},
  {id:'st4', ic:'🚀', name:'发货',          sub:'订单推送 · 账单开票 · 售后'},
];

/* ================= 数据：PC / 小程序 ================= */
/* step: t 标题 | d 说明(数组/字符串) | img 该步截图在源文档中的图序号 | pc+pcTarget 需转PC | rel 互链[{to,label,tab?}] | todo 正文待补 */
/* ================= 拼多多 · 管易云对接（PC / 小程序 共用同一套步骤与截图） ================= */
const PDD_LINKS=[
  {u:'https://alidocs.dingtalk.com/i/nodes/Obva6QBXJwxNZoMOCM7vbXL48n4qY5Pr',t:'管易云对接常见 QA'},
  {u:'assets/pdd_template.xlsx',t:'管易云商品及规格导入模板 (.xlsx)',dl:1},
];
const PDD_STEPS=[
  {t:'登录并激活管易云账号',d:[
    '用管易云账号登录，首次进入需完成"账户激活"。',
    '登录成功后，在左上角把菜单切换到「电商 ERP」工作台，再进入后续操作。'],img:[1,2,3]},
  {t:'从 CNBP 导出货品信息',d:[
    '先在菜鸟 CNBP 里把单个普通货品的信息导出，作为管易云建品的数据来源。',
    '导出内容包含货品名称、编码、条码等，后面批量导入会用到。'],img:[4,5],rel:[{to:'m4',label:'PC·商货品管理',tab:'pc'}]},
  {t:'批量导入管易云',d:[
    '把导出的货品信息按固定模板整理后，在管易云"商品 - 批量导入"上传。',
    '务必使用下方固定模板填写，字段错位会导致导入失败或绑定错乱。'],img:[6,7],links:[{u:'assets/pdd_template.xlsx',t:'下载固定模板',dl:1}]},
  {t:'填写规格编码 / 核对货品编码',d:[
    '在拼多多后台为每个规格填写"规格编码"。',
    '规格编码需与菜鸟货品编码保持一致，两边对齐后才能正确绑定、避免发错货。'],img:[8,9]},
  {t:'开启负库存',d:[
    '在管易云库存设置中开启"负库存"，避免平台已来单、云仓尚未同步时被判缺货而卡单。'],img:[10,11]},
  {t:'维护食品保质期（食品类）',d:[
    '食品类目需先"编辑货品"补全保质期字段，再在保质期维护页录入生产 / 到期日期规则。'],img:[12,13]},
  {t:'创建组合商品',d:[
    '进入"组合商品"界面 → 新增组合商品，先维护供应商信息、"自动拆分"保持默认。',
    '分别选择组成子件货品 1、货品 2，生成管易云组合货品代码。',
    '把该组合货品代码回填到拼多多后台的规格编码，实现组合 SKU 对应。'],img:[14,15,16,17,18,19,20,21]},
  {t:'维护商品条码',d:[
    '进入商品条码页维护条码；菜鸟侧条码在 CNBP 的货品条码位置查看，两边需一致。'],img:[22,23,24]},
  {t:'同步货品',d:['完成建品与条码后，执行"同步货品"，把管易云商品信息同步到发货链路。'],img:[25]},
  {t:'选择包装方案',d:['进入包装方案页，为每个货品选择包装方案（不选会默认菜鸟纸箱并计费）。'],img:[26,27],rel:[{to:'m4',label:'PC·包装方案',tab:'pc'}]},
  {t:'授权店铺（去订购 → 登录授权）',d:[
    '在管易云点击"去订购"，进入服务市场订购页面，登录后完成对拼多多店铺的授权。'],img:[28,29,30],rel:[{to:'m3',label:'PC·店铺授权',tab:'pc'}]},
  {t:'平台商品绑定 / 铺货',d:[
    '进入"平台铺货"，下载平台商品，逐项自查规格编码是否已正确关联到管易云货品。',
    '缺失或不一致的，删除重下或修改后重下，直到平台商品与货品"一致"，绑定才算完成。'],img:[31,32,33,34,35,36,37,38]},
  {t:'订单推送',d:[
    '订单流程：店铺 → 管易云审核（默认自动）→ 推送到 CNBP → CNBP 审核（默认自动）→ 仓库发货 → 出库自动回传。',
    '在管易云与 CNBP 两侧对应的状态里确认订单已成功推送。'],img:[39,40],rel:[{to:'m7',label:'PC·订单推送到仓',tab:'pc'}]},
  {t:'手动审核订单',d:['如需人工干预，在"待审核"列表筛选订单后点击"审核"推单。'],img:[41,42]},
  {t:'更换货品',d:[

/* ================= 渲染 ================= */
let curTab='pc';
const $=s=>document.querySelector(s);
/* 图片基址：留空=相对路径(GitHub Pages)；填国内可访问的 OSS/CDN 前缀则整站图片走该域名，
   例如 https://your-bucket.oss-cn-hangzhou.aliyuncs.com/cainiao-guide （末尾不要带斜杠） */
const IMG_BASE='';
function iu(p){return IMG_BASE&&!/^https?:/i.test(p)?IMG_BASE.replace(/\/+$/,'')+'/'+p.replace(/^\/+/,''):p;}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stg(id){return STAGES.find(s=>s.id===id);}

function stepImgs(m,s){
  const valid=IMAGES[m.imgKey||m.id]||[];
  const idxs=s.img||[];
  if(!idxs.length) return '';
  const cells=idxs.map(i=>({gi:i,src:valid[i-1]})).filter(o=>o.src);
  if(!cells.length) return '';
  const n=cells.length;
  const thumbs=cells.map((c,j)=>{
    const cap=`${m.title} · ${s.t} · 图 ${c.gi}（${j+1}/${n}）`;
    const full=c.src, thumb=c.src.replace(/^assets\//,'assets/t/');
    return `<div class="th" data-cap="${esc(cap)}" data-full="${iu(full)}"><img src="${iu(thumb)}" alt="${esc(cap)}" loading="lazy" decoding="async" onload="this.closest('.th').classList.add('ld')" onerror="this.closest('.th').style.display='none'"><span class="sk">加载中…</span><span class="n">${c.gi}</span><span class="mag">🔍 点击放大</span></div>`;
  }).join('');
  return `<div class="step-imgs">${thumbs}</div>`;
}
function linkChip(l){
  const ext=/^https?:/i.test(l.u);
  const attrs=ext?'target="_blank" rel="noopener"':(l.dl?'download':'');
  const ic=l.dl?'⬇️':(ext?'🔗':'📎');
  return `<a class="lnk" href="${iu(l.u)}" ${attrs}>${ic} ${esc(l.t)}</a>`;
}
function stepHTML(m,s,i,tab){
  let chip='';
  if(s.pc) chip=`<span class="chip chip-pc" onclick="goto('${s.pcTarget.tab}','${s.pcTarget.module}')">⚠️ 需在 PC 端完成 ›</span>`;
  else if(s.todo) chip=`<span class="chip chip-todo">正文待补</span>`;
  const desc=Array.isArray(s.d)?`<ul>${s.d.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:esc(s.d||'');
  const rels=(s.rel&&s.rel.length)?`<div class="rels"><span class="rl-lbl">🔗 相关步骤：</span>${s.rel.map(r=>`<span class="rel" onclick="goto('${r.tab||tab}','${r.to}')">${esc(r.label)} ›</span>`).join('')}</div>`:'';
  const lnks=(s.links&&s.links.length)?`<div class="step-links">${s.links.map(linkChip).join('')}</div>`:'';
  const qr=s.qr?`<div class="step-qr"><div class="th qr-th" data-cap="${esc(s.qrCap||'小程序码')}"><img src="${iu(s.qr)}" alt="${esc(s.qrCap||'小程序码')}" loading="lazy" decoding="async" onload="this.closest('.th').classList.add('ld')"><span class="sk">加载中…</span><span class="mag">🔍 点击放大</span></div><div class="qr-txt">${esc(s.qrCap||'微信扫码进入小程序')}${s.qrSub?`<span class="qr-sub">${esc(s.qrSub)}</span>`:''}</div></div>`:'';
  return `<div class="step" id="${m.id}-${i}">
    <div class="step-h"><span class="step-n">步骤 ${i+1}</span><h4 class="step-t">${esc(s.t)}</h4>${chip}</div>
    <div class="step-d">${desc}</div>${qr}${lnks}${rels}${stepImgs(m,s)}</div>`;
}
function moduleHTML(m,tab){
  const note=m.note?`<div class="tip${m.noteWarn?' warn':''}"><span class="e">${m.noteWarn?'⚠️':'💡'}</span><div>${esc(m.note)}</div></div>`:'';
  const note2=m.note2?`<div class="tip"><span class="e">🔁</span><div>${esc(m.note2)}</div></div>`:'';
  const links=(m.links&&m.links.length)?`<div class="mod-links"><span class="ml-lbl">📎 相关资料：</span>${m.links.map(linkChip).join('')}</div>`:'';
  const login=m.login?`<div class="mod-login">${linkChip(m.login)}</div>`:'';
  return `<section class="mod" id="${m.id}">
    <div class="mod-h"><div class="mod-ic">${m.ic}</div><div><div class="kicker">${stg(m.stage).name}</div><h2>${m.title}</h2></div></div>
    <div class="mod-desc">${esc(m.desc)}</div>
    ${login}
    ${links}
    ${note}
    ${note2}
    ${m.steps.map((s,i)=>stepHTML(m,s,i,tab)).join('')}
  </section>`;
}
function stagebarHTML(){
  return `<div class="stagebar"><span class="lbl">第一次入仓动线 ›</span>${STAGES.map((s,i)=>
    `<div class="stage-pill" data-stage="${s.id}" onclick="jumpStage('${s.id}')"><span class="idx">${i+1}</span><span class="ic">${s.ic}</span><span><div class="st">${s.name}</div><div class="sd">${s.sub}</div></span></div>`
    +(i<STAGES.length-1?'<span class="stage-sep">›</span>':'')).join('')}</div>`;
}
function tocHTML(mods){
  let h='';
  STAGES.forEach(sg=>{
    const inS=mods.filter(m=>m.stage===sg.id);
    if(!inS.length) return;
    h+=`<div class="grp-h"><span class="dot"></span>${sg.ic} ${sg.name}</div>`;
    inS.forEach(m=>{
      const hasPc=m.steps.some(x=>x.pc);
      h+=`<a href="#${m.id}" data-toc="${m.id}">${m.title}${hasPc?' <span class="pc-tag">↗PC</span>':''}</a>`;
    });
  });
  return h;
}
function renderFlow(tab){
  const mods=GUIDE[tab].modules;
  const callout = tab==='pc'?'':
    `<div class="tip warn" style="margin:16px 30px 0"><span class="e">📌</span><div>小程序可完成大部分日常操作；<b>打印条码、批量上传、完整账单开票</b>等仍需去 PC。看到橙色「需在 PC 端完成」标签，点一下即跳到 PC 版对应模块。</div></div>`;
  let content='';
  STAGES.forEach(sg=>{
    const inS=mods.filter(m=>m.stage===sg.id);
    if(!inS.length) return;
    content+=`<div class="stage-head" id="${sg.id}"><div class="sh-ic">${sg.ic}</div><div><div class="sh-t">${sg.name}</div><div class="sh-s">${sg.sub}</div></div></div>`;
    content+=inS.map(m=>moduleHTML(m,tab)).join('');
  });
  $('#panel-'+tab).innerHTML = stagebarHTML()+callout+
    `<div class="layout"><nav class="toc">${tocHTML(mods)}</nav><main class="body">${content}</main></div>`;
  spy();
}
function renderFAQ(){
  const items=FAQ.map((f,i)=>`<div class="faq-item" id="faq${i}"><button class="faq-q" onclick="document.getElementById('faq${i}').classList.toggle('open')">${esc(f.q)}<span class="arw">▾</span></button><div class="faq-a">${esc(f.a)}</div></div>`).join('');
  $('#panel-faq').innerHTML=`<div class="faq"><div class="faq-h"><span class="bar"></span>常 见 问 题（PC / 小程序 通用）</div>
    <div class="tip"><span class="e">💡</span><div>点击问题展开答案，正文取自源手册「菜鸟云仓常见问题」。</div></div>${items}</div>`;
}

/* ================= 交互 ================= */
function renderTabs(){
  const tabs=[{id:'pc',ic:'🖥️',l:'PC 版操作指南'},{id:'mp',ic:'📱',l:'小程序版操作指南',rec:1,recTip:'小程序流程更简单，推荐优先使用；PC 端尚未简化'},{id:'faq',ic:'❓',l:'常见问题'}];
  $('#tabs').innerHTML=tabs.map(t=>`<button class="tab-btn ${t.id===curTab?'active':''}" data-tab="${t.id}"><span class="em">${t.ic}</span>${t.l}${t.rec?`<span class="rec-badge" title="${esc(t.recTip)}">推荐</span>`:''}</button>`).join('');
}
function switchTab(name){
  curTab=name; renderTabs();
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  $('#panel-'+name).classList.add('active');
  markLoaded(); setTimeout(markLoaded,400);
  window.scrollTo({top:0,behavior:'smooth'});
}
function jumpStage(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function goto(tab,mod){
  if(tab!==curTab) switchTab(tab);
  setTimeout(()=>{const el=document.getElementById(mod);if(!el)return;
    el.style.transition='box-shadow .3s';el.style.boxShadow='0 0 0 3px rgba(255,122,69,.45)';
    el.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(()=>el.style.boxShadow='',1500);},120);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab-btn');if(b)switchTab(b.dataset.tab);});

/* 滚动高亮：当前阶段 pill + 当前模块目录项（用 scroll 监听，打印安全，不用 IntersectionObserver） */
function spy(){
  const panel=document.querySelector('.panel.active'); if(!panel) return;
  const hh=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hh'))+parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sh'))+20;
  let actStage=null,actMod=null;
  panel.querySelectorAll('.stage-head').forEach(el=>{if(el.getBoundingClientRect().top<=hh)actStage=el.id;});
  panel.querySelectorAll('section.mod').forEach(el=>{if(el.getBoundingClientRect().top<=hh)actMod=el.id;});
  if(!actStage){const f=panel.querySelector('.stage-head');if(f)actStage=f.id;}
  panel.querySelectorAll('.stage-pill').forEach(p=>p.classList.toggle('active',p.dataset.stage===actStage));
  panel.querySelectorAll('[data-toc]').forEach(a=>a.classList.toggle('active',a.dataset.toc===actMod));
}
let ticking=false;
function markLoaded(){document.querySelectorAll('.th:not(.ld)').forEach(t=>{const i=t.querySelector('img');if(i&&i.complete&&i.naturalWidth>0)t.classList.add('ld');});}
window.addEventListener('load',markLoaded);
window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(()=>{spy();markLoaded();ticking=false;});ticking=true;}});

/* lightbox */
let lbGroup=[],lbIdx=0;
function openLB(el){
  const img=el.querySelector('img');if(!img)return;
  $('#lbImg').src=el.dataset.full||img.src;
  $('#lbCap').textContent=el.dataset.cap||'';
  const wrap=el.closest('.step-imgs')||el.closest('.gal');
  if(wrap){lbGroup=[...wrap.querySelectorAll('.th')];lbIdx=lbGroup.indexOf(el);}
  else{lbGroup=[];lbIdx=0;}
  $('#lb').classList.add('show');
}
function lbStep(d){if(!lbGroup.length)return;lbIdx=(lbIdx+d+lbGroup.length)%lbGroup.length;openLB(lbGroup[lbIdx]);}
function closeLB(){$('#lb').classList.remove('show');}
document.addEventListener('click',e=>{
  const t=e.target.closest('.th');
  if(t){openLB(t);return;}
  if(e.target.id==='lb'||e.target.classList.contains('x'))closeLB();
});
document.addEventListener('keydown',e=>{
  if(!$('#lb').classList.contains('show'))return;
  if(e.key==='Escape')closeLB();
  else if(e.key==='ArrowRight')lbStep(1);
  else if(e.key==='ArrowLeft')lbStep(-1);
});

/* init */
renderTabs(); renderFlow('pc'); renderFlow('mp'); renderFAQ();
</script>

  overscroll-behavior-y:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0;}
input,select,textarea{font-family:inherit;font-size:16px;}
.hide{display:none !important;}

/* ===== 手机外壳：浏览器打开时居中显示 ===== */
#phone{
  position:relative;margin:0 auto;background:var(--bg);
  width:100%;max-width:430px;height:100%;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:560px){
  body{background:#EDE3D9;display:flex;align-items:center;justify-content:center;padding:18px;}
  #phone{height:calc(100vh - 36px);height:calc(100dvh - 36px);border-radius:38px;box-shadow:0 24px 60px rgba(70,45,25,.28), 0 0 0 10px #2B2A33;max-height:900px;}
}

/* ===== 顶部标题栏 ===== */
.topbar{
  padding:calc(var(--safe-t) + 14px) 20px 12px;
  display:flex;align-items:center;gap:10px;flex:none;
  background:var(--bg);
}
.topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;}
.topbar .spacer{flex:1;}
.icon-btn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:#fff;box-shadow:var(--shadow);font-size:17px;transition:transform .12s;
}
.icon-btn:active{transform:scale(.92);}

/* ===== 滚动区 ===== */
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 16px 20px;
}
.scroll.has-tab{padding-bottom:calc(80px + var(--safe-b));}

/* ===== 底部 Tab ===== */
/* 底部导航：内容行固定高度 + 独立安全区垫层，图标文字必然居中 */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;flex:none;
  z-index:40;
  background:transparent;
}
.tabbar .tb-row{
  display:flex;gap:2px;
  background:linear-gradient(180deg,#FF9C5B 0%,#FF7B3E 52%,#F9622E 100%);
  padding:6px 8px;
  border-radius:14px 14px 0 0;
  box-shadow:0 -4px 16px rgba(240,110,50,.22);
  height:56px;               /* 固定内容行高度 */
  align-items:center;
}
.tabbar .tb-safe{
  height:var(--safe-b);
  background:#F9622E;        /* 与渐变色底部一致，视觉连续 */
}
.tabbar button{
  flex:1;height:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:rgba(255,255,255,.86);font-weight:700;
  border-radius:12px;transition:all .2s;position:relative;
  padding:0;
}
.tabbar button .ic{font-size:17px;line-height:1;transition:transform .2s;}
.tabbar button.on{
  color:var(--brand-2);font-weight:900;
  background:#fff;
  box-shadow:0 3px 10px rgba(180,60,10,.2);
}
.tabbar button.on .ic{transform:scale(1.04);}
.tabbar button:active{transform:scale(.96);}

/* ===== 通用卡片 ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);}
.sec-title{
  display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-size:14px;font-weight:800;color:var(--ink-2);
}
.sec-title .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--brand-2);}

/* ===== 首页：孩子卡片 ===== */
.kid-list{display:grid;gap:12px;}
.kid-card{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);
  background:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .12s;
}
.kid-card:active{transform:scale(.985);}
.kid-card::after{
  content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,138,91,.14),transparent 70%);
  pointer-events:none;
}
.kid-card.boy::after{background:radial-gradient(circle,rgba(88,158,255,.16),transparent 70%);}
.kid-card.girl::after{background:radial-gradient(circle,rgba(255,120,170,.16),transparent 70%);}
.avatar{
  width:58px;height:58px;border-radius:20px;flex:none;overflow:hidden;
  display:grid;place-items:center;font-size:26px;background:#FFF0E6;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.kid-info{flex:1;min-width:0;}
.kid-name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;}
.kid-meta{font-size:12px;color:var(--ink-3);margin-top:3px;}
.kid-pt{text-align:right;flex:none;}
.kid-pt .n{font-size:24px;font-weight:900;color:var(--brand-2);letter-spacing:-.5px;line-height:1;}
.kid-pt .u{font-size:11px;color:var(--ink-3);margin-top:3px;font-weight:600;}

/* ===== 首页：当前孩子大卡 ===== */
.hero{
  margin-top:6px;border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFA26B 0%,#FF6B35 55%,#F5522D 100%);
  box-shadow:0 12px 28px rgba(245,82,45,.3);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none;}
.hero::before{width:150px;height:150px;right:-42px;top:-62px;}
.hero::after{width:96px;height:96px;right:34px;bottom:-58px;background:rgba(255,255,255,.09);}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
.hero-top .avatar{width:50px;height:50px;border-radius:17px;background:rgba(255,255,255,.25);box-shadow:none;font-size:23px;}
.hero-name{font-size:16px;font-weight:800;}
.hero-sub{font-size:12px;opacity:.86;margin-top:2px;}
.hero-balance{position:relative;z-index:1;margin-top:16px;display:flex;align-items:flex-end;gap:8px;}
.hero-balance .num{font-size:52px;font-weight:900;line-height:.95;letter-spacing:-2px;}
.hero-balance .lbl{font-size:13px;opacity:.9;padding-bottom:8px;font-weight:700;}
.hero-stat{
  position:relative;z-index:1;margin-top:14px;display:flex;gap:8px;
}
.hero-stat div{
  flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 10px;
  backdrop-filter:blur(4px);
}
.hero-stat .k{font-size:10px;opacity:.85;font-weight:600;}
.hero-stat .v{font-size:15px;font-weight:800;margin-top:2px;}

/* 操作按钮组 */
.act-row{display:flex;gap:10px;margin-top:14px;}
.act-row button{
  flex:1;border-radius:16px;padding:14px 8px;font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:var(--shadow);transition:transform .12s;
}
.act-row button:active{transform:scale(.96);}
.act-add{background:#fff;color:var(--up);}
.act-minus{background:#fff;color:var(--down);}
.act-shop{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(43,42,51,.28);}

/* ===== 任务打卡 ===== */
.task-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;
  border-radius:16px;box-shadow:var(--shadow);margin-bottom:9px;
}
.task-item .t-ic{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;background:#FFF4EC;flex:none;
}
.task-body{flex:1;min-width:0;}
.task-name{font-size:14px;font-weight:700;}
.task-sub{font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tick{
  border-radius:11px;padding:8px 14px;font-size:13px;font-weight:800;flex:none;
  background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(255,138,91,.35);
  transition:transform .12s;
}
.tick:active{transform:scale(.93);}
.tick.done{background:#EFEDF3;color:var(--ink-3);box-shadow:none;}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;background:#F4F1FA;color:var(--ink-2);font-size:10px;font-weight:700;}
.pill.cash-pill{background:#E7F8F1;color:var(--down);margin-left:6px;vertical-align:middle;}
.cash-tag{display:inline-block;padding:1px 7px;border-radius:20px;background:#E7F8F1;color:var(--down);font-size:10px;font-weight:800;}

/* ===== 兑换 ===== */
.shop-item{
  display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:18px;
  box-shadow:var(--shadow);margin-bottom:10px;transition:transform .12s;
}
.shop-item .s-ic{width:46px;height:46px;border-radius:15px;background:#FFF4EC;display:grid;place-items:center;font-size:22px;flex:none;}
.shop-item .s-name{font-size:14px;font-weight:800;}
.shop-item .s-sub{font-size:11px;color:var(--ink-3);margin-top:3px;}
.shop-item .s-cost{font-size:15px;font-weight:900;color:var(--down);white-space:nowrap;}
.shop-item .s-cost small{font-size:10px;font-weight:700;}
.buy{
  border-radius:12px;padding:9px 15px;background:var(--brand-2);color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 4px 12px rgba(255,107,53,.32);transition:transform .12s;white-space:nowrap;
}
.buy:active{transform:scale(.93);}
.buy.off{background:#EFEDF3;color:var(--ink-3);box-shadow:none;}

/* ===== 左滑删除 ===== */
.swipe{
  position:relative;overflow:hidden;border-radius:18px;margin-bottom:9px;
  background:transparent;
}
.swipe .sw-inner{
  position:relative;z-index:2;transition:transform .26s cubic-bezier(.22,.9,.3,1);
  will-change:transform;touch-action:pan-y;
}
.swipe .sw-inner.dragging{transition:none;}
.swipe .sw-del{
  position:absolute;top:0;right:0;bottom:0;width:86px;z-index:1;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
  background:#FF5A4E;color:#fff;font-size:12px;font-weight:800;border-radius:18px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.swipe .sw-del .ic{font-size:17px;}
.swipe.open .sw-inner{transform:translateX(-86px);}
/* 让内部卡片去掉自身外边距，交由 .swipe 统一控制 */
.swipe .sw-inner > .task-item,
.swipe .sw-inner > .shop-item,
.swipe .sw-inner > .kid-card{margin-bottom:0;}
.swipe .sw-inner > .kid-card{border-radius:18px;}

/* ===== 记录 ===== */
.rec-item{
  display:flex;gap:12px;padding:13px 14px;background:#fff;border-radius:16px;margin-bottom:8px;
  box-shadow:0 2px 10px rgba(90,63,40,.05);
}
.rec-ic{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;

}

.rec-t{font-size:14px;font-weight:700;word-break:break-all;}
.rec-m{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.rec-v{font-size:17px;font-weight:900;flex:none;}
.rec-v.up{color:var(--up);}
.rec-v.down{color:var(--down);}

.empty{
  text-align:center;padding:46px 20px;color:var(--ink-3);font-size:13px;line-height:1.9;
}
.empty .e-ic{font-size:42px;display:block;margin-bottom:10px;opacity:.55;}

.sheet-mask{
  position:fixed;inset:0;background:rgba(30,22,18,.42);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s ease;
  padding:0;
}

}

.field{margin-bottom:14px;}

.stepper button{

.btn-primary{

  transition:transform .12s;margin-top:6px;
}

}

.avatar-pick{display:flex;align-items:center;gap:14px;}
.avatar-prev{

.mini-btn{

  font-size:12px;font-weight:800;position:relative;z-index:2;transition:transform .12s;
}
.mini-btn:active{transform:scale(.94);}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translate(-50%,16px);
  background:rgba(43,42,51,.93);color:#fff;padding:11px 20px;border-radius:14px;

  display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--ink-2);
  padding:6px 0;
}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

   ============================================================ */
const KEY='growth_points_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const DEFAULT_REWARDS=[
  {id:uid(),emoji:'🎮',name:'玩 30 分钟游戏',cost:10},
  {id:uid(),emoji:'🎮',name:'玩 60 分钟游戏',cost:18},
  {id:uid(),emoji:'🍦',name:'买个冰淇淋',cost:6},
  {id:uid(),emoji:'🎬',name:'看一部电影',cost:15},

  {id:uid(),emoji:'🎡',name:'周末去游乐场',cost:60},
  {id:uid(),emoji:'💰',name:'换零钱 · 1 元',cost:10,kind:'cash',money:1},

];
const DEFAULT_KIDS=[
  {id:uid(),name:'小星',age:6,gender:'boy',photo:'',createdAt:Date.now()},
  {id:uid(),name:'小月',age:4,gender:'girl',photo:'',createdAt:Date.now()+1},
];

let DB=load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) throw 0;
    const d=JSON.parse(raw);
    return {
      kids:d.kids||[], tasks:d.tasks||[], rewards:d.rewards||[], logs:d.logs||[],
      activeKid:d.activeKid||'', seeded:d.seeded||false
    };
  }catch(e){
    return {kids:DEFAULT_KIDS, tasks:DEFAULT_TASKS, rewards:DEFAULT_REWARDS, logs:[], activeKid:DEFAULT_KIDS[0].id, seeded:true};
  }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* 派生数据 */
const balanceOf = id => round2(DB.logs.filter(l=>l.kidId===id).reduce((s,l)=>s+Number(l.delta||0),0));
const kidsLogs  = id => DB.logs.filter(l=>l.kidId===id).sort((a,b)=>b.ts-a.ts);
const kidLogs = kidsLogs;
const kidById   = id => DB.kids.find(k=>k.id===id);

function addLog({kidId,delta,reason,type,emoji,cash}){
  const rec={id:uid(),kidId,delta,reason,type,emoji:emoji||(delta>=0?'✨':'💫'),ts:Date.now()};
  if(cash) rec.cash=cash;
  DB.logs.push(rec);
  save();
}
function todayStr(ts){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
const todayOf  = kidId => kidsLogs(kidId).filter(l=>todayStr(l.ts)===todayStr(Date.now()) && l.type==='task');
/* 今日全部记录（含手动加/扣分、兑换） */
const todayAll = kidId => DB.logs.filter(l=>l.kidId===kidId && todayStr(l.ts)===todayStr(Date.now()));
/* 今日某任务已打卡次数（允许多次打卡，用于展示"今天已打卡 ×N"） */
const tickTimesToday = (kidId,taskId) => todayOf(kidId).filter(l=>l.taskId===taskId && l.sign===todayStr(Date.now())).length;

/* 任务打卡记录需带 taskId + 当日 sign */
function addTaskLog(kid,task){
  DB.logs.push({
    id:uid(),kidId:kid.id,delta:task.points,reason:task.name,type:'task',
    taskId:task.id,sign:todayStr(Date.now()),emoji:task.emoji||'✅',ts:Date.now()
  });
  save();
}

/* 分数格式化：去掉多余小数（12 -> 12，1.5 -> 1.5，2.0 -> 2） */
const fmt = n => {
  const v = Math.round((Number(n)||0)*100)/100;
  return Number.isInteger(v) ? String(v) : String(v).replace(/0+$/,'').replace(/\.$/,'');
};
const round2 = n => Math.round((Number(n)||0)*100)/100;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 属性值专用：不做实体转义（避免 &quot; 塞进 value 后被截断），只处理会破坏属性的字符 */
const attr = s => String(s??'').replace(/[<>]/g,c=>c==='<'?'&lt;':'&gt;').replace(/"/g,'&quot;');
const $  = s => document.querySelector(s);

let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1900);
}

function fmtTime(ts){
  const d=new Date(ts), now=new Date();
  const hm=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const sameDay = d.toDateString()===now.toDateString();
  const y=new Date(now.getTime()-86400000);
  if(sameDay) return `今天 ${hm}`;
  if(d.toDateString()===y.toDateString()) return `昨天 ${hm}`;
  return `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
}

function avatarHTML(k,cls=''){
  const emoji = k.gender==='girl'?'👧':'👦';
  if(k.photo) return `<div class="avatar ${cls}"><img src="${k.photo}" alt=""></div>`;
  return `<div class="avatar ${cls}" style="background:${k.gender==='girl'?'#FFEDF4':'#EAF3FF'}">${emoji}</div>`;
}

/* 左滑删除：统一绑定器。
   用法：swipeWrap(innerHTML, deleteHandler) -> 返回带滑动的容器 HTML
   绑定：bindSwipe(container) 在 render 后调用 */
const SW_W = 86;
function swipeWrap(innerHTML, label='删除'){
  return `<div class="swipe">
    <div class="sw-del"><span class="ic">🗑</span>${label}</div>
    <div class="sw-inner">${innerHTML}</div>
  </div>`;
}

let openSwipe=null;
function closeAllSwipe(except){
  document.querySelectorAll('.swipe.open').forEach(el=>{
    if(el!==except){ el.classList.remove('open'); }
  });
  if(except!==openSwipe) openSwipe = except||null;
}

function bindSwipe(scope){
  scope.querySelectorAll('.swipe').forEach(box=>{
    if(box.dataset.bound) return;
    box.dataset.bound='1';
    const inner=box.querySelector('.sw-inner');
    const delBtn=box.querySelector('.sw-del');
    let x0=0,y0=0,dx=0,dy=0,dragging=false,locked=null,base=0;

    const onStart=e=>{
      const t=e.touches?e.touches[0]:e;
      x0=t.clientX; y0=t.clientY; dx=0; dy=0; locked=null; dragging=true;
      base = box.classList.contains('open') ? -SW_W : 0;
      inner.classList.add('dragging');
    };
    const onMove=e=>{
      if(!dragging) return;
      const t=e.touches?e.touches[0]:e;
      dx=t.clientX-x0; dy=t.clientY-y0;
      if(locked===null){
        if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
        locked = Math.abs(dx)>Math.abs(dy)*1.15 ? 'x' : 'y';
        if(locked==='y'){ endDrag(); return; }
        closeAllSwipe(box);
      }
      if(locked!=='x') return;
      e.preventDefault();
      let off = base + dx;
      off = Math.max(-SW_W*1.25, Math.min(0, off));
      inner.style.transform = `translateX(${off}px)`;
    };
    const endDrag=()=>{
      if(!dragging) return;
      dragging=false;
      inner.classList.remove('dragging');
      inner.style.transform='';
      const off = base + dx;
      if(locked==='x' && off < -SW_W*0.42){ box.classList.add('open'); openSwipe=box; }
      else box.classList.remove('open');
    };

    inner.addEventListener('touchstart',onStart,{passive:true});
    inner.addEventListener('touchmove',onMove,{passive:false});
    inner.addEventListener('touchend',endDrag);
    inner.addEventListener('touchcancel',endDrag);
    inner.addEventListener('mousedown',onStart);
    window.addEventListener('mousemove',e=>{ if(dragging) onMove(e); });
    window.addEventListener('mouseup',endDrag);

    // 点删除按钮
    delBtn.addEventListener('click',e=>{
      e.stopPropagation();
      if(box.dataset.busy) return;
      box.dataset.busy='1';
      (box._onDelete||(()=>{}))();
      setTimeout(()=>{ delete box.dataset.busy; },600);
    });

    // 已展开时，点内容区只收起，不触发内部按钮
    inner.addEventListener('click',e=>{
      if(box.classList.contains('open')){
        e.stopPropagation(); e.preventDefault();
        box.classList.remove('open'); openSwipe=null;
      }
    },true);
  });
}

/* 弹层 */
function openSheet(html, onMount){
  const root=$('#modalRoot');
  if(root.querySelector('.sheet-mask')) return; // 已有弹层时不重复打开
  root.innerHTML=`<div class="sheet-mask"><div class="sheet"><div class="sheet-grip"></div>${html}</div></div>`;
  const mask=root.querySelector('.sheet-mask');
  mask.addEventListener('click',e=>{ if(e.target===mask) closeSheet(); });
  onMount && onMount(root);
}
function closeSheet(){ $('#modalRoot').innerHTML=''; }
/* 关闭所有弹层（含叠加的确认框） */
function closeAllSheets(){
  $('#modalRoot').innerHTML='';
  document.querySelectorAll('.swipe.open').forEach(el=>el.classList.remove('open'));
  try{ openSwipe=null; }catch(e){}
}

let sheetStack=[];
function confirmSheet({title,text,okText='确定',danger=false,onOk}){
  // 二次确认：允许叠加在当前弹层之上（例如编辑弹层里点删除）
  const root=$('#modalRoot');
  const wrap=document.createElement('div');
  wrap.className='sheet-mask confirm-layer';
  wrap.style.zIndex=String(200+sheetStack.length*10);
  wrap.innerHTML=`<div class="sheet"><div class="sheet-grip"></div>
    <h3>${esc(title)}</h3>
    <div class="sub">${esc(text||'')}</div>
    <button class="btn-primary ${danger?'danger':''}" id="cfOk">${esc(okText)}</button>
    <button class="btn-ghost" id="cfNo">取消</button>
  </div>`;
  root.appendChild(wrap);
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#cfOk').onclick=()=>{ wrap.remove(); onOk&&onOk(); };
  wrap.querySelector('#cfNo').onclick=()=>wrap.remove();
}

let state={tab:'home', kidId:DB.activeKid||(DB.kids[0]&&DB.kids[0].id)||'', logFilter:'all'};

function go(tab,kidId){
  state.tab=tab;
  if(kidId) state.kidId=kidId;
  render();
}

function render(){
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===state.tab);
  });
  const v=$('#view'), left=$('#topLeft'), right=$('#topRight'), title=$('#topTitle');
  left.innerHTML=''; right.innerHTML=''; title.textContent='积分宝';
  v.scrollTop=0;

  if(!state.kidId && DB.kids[0]) state.kidId=DB.kids[0].id;

  if(state.tab==='home')      renderHome(v,left,right,title);
  else if(state.tab==='shop') renderShop(v,left,right,title);
  else if(state.tab==='log')  renderLog(v,left,right,title);
  else                        renderMe(v,left,right,title);
}
function rerenderKeepScroll(){ const t=$('#view').scrollTop; render(); $('#view').scrollTop=t; }

function switchKid(id){ state.kidId=id; DB.activeKid=id; save(); render(); }

function tickTask(kidId,taskId){
  const k=kidById(kidId), t=DB.tasks.find(x=>x.id===taskId);
  if(!k||!t) return;
  addTaskLog(k,t);
  const times=tickTimesToday(kidId,taskId);
  toast(`${k.name} 打卡成功，+${fmt(t.points)} 分 🎉${times>1?`（今天第 ${times} 次）`:''}`);
  rerenderKeepScroll();
}

function openScore(dir,kidId){
  const kid=kidById(kidId)||kidById(state.kidId);
  if(!kid){ toast('请先添加宝贝'); return; }
  const up=dir==='up';
  const presets=[0.5,1,1.5,2,3,5,10];
  openSheet(`
    <h3>${up?'给 '+esc(kid.name)+' 加分':'给 '+esc(kid.name)+' 扣分'}</h3>
    <div class="sub">${up?'表现好就记上一笔 ✨':'有需要改进的地方，扣一点 ⚠️'}</div>
    <div class="field">
      <label>原因</label>
      <input type="text" id="scReason" placeholder="${up?'比如：语文作业连续 12 个 A+':'比如：答应的事情没有做到'}" maxlength="40">
    </div>
    <div class="field">
      <label>分数<span style="font-weight:600;color:var(--ink-3);margin-left:6px">支持 0.5 分</span></label>
      <div class="stepper">
        <button type="button" id="scMinus">−</button>
        <div class="wrap"><input type="number" id="scNum" value="1" min="0.5" step="0.5" inputmode="decimal"></div>
        <button type="button" id="scPlus">＋</button>
      </div>
      <div class="chips" style="margin-top:10px">
        ${presets.map(v=>`<button type="button" class="chip ${v===1?'on':''}" data-n="${v}">${fmt(v)} 分</button>`).join('')}
      </div>
    </div>
    <button class="btn-primary ${up?'':'danger'}" id="scOk">${up?'确认加分':'确认扣分'}</button>
    <button class="btn-ghost" id="scNo">取消</button>
  `,r=>{
    const num=r.querySelector('#scNum');
    const setN=v=>{
      const val=round2(Math.max(0.5,Math.min(9999,v)));
      num.value=fmt(val);
      r.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',round2(+c.dataset.n)===round2(val)));
    };
    // 输入时：只允许 0.5 的倍数，自动纠正
    num.addEventListener('blur',()=>{
      let v=parseFloat(num.value);
      if(isNaN(v)||v<=0){ setN(0.5); return; }
      setN(Math.round(v*2)/2);   // 吸附到 0.5 网格
    });
    r.querySelector('#scMinus').onclick=()=>setN(round2((parseFloat(num.value)||0.5)-0.5));
    r.querySelector('#scPlus').onclick =()=>setN(round2((parseFloat(num.value)||0.5)+0.5));
    r.querySelectorAll('.chip').forEach(c=>c.onclick=()=>setN(+c.dataset.n));
    r.querySelector('#scNo').onclick=closeSheet;
    r.querySelector('#scOk').onclick=()=>{
      const reason=r.querySelector('#scReason').value.trim();
      let n=parseFloat(num.value);
      if(!reason){ toast('请填写原因'); return; }
      if(isNaN(n)||n<=0){ toast('请填写正确的分数'); return; }
      n=round2(Math.round(n*2)/2);   // 强制 0.5 精度
      addLog({kidId:kid.id,delta:up?n:-n,reason,type:'manual',emoji:up?'✨':'⚠️'});
      closeSheet();
      toast(`${up?'已加':'已扣'} ${fmt(n)} 分`);
      render();
    };
  });
}

function redeem(rewardId){
  const rw=DB.rewards.find(r=>r.id===rewardId);
  const kid=kidById(state.kidId);
  if(!rw||!kid) return;
  const bal=balanceOf(kid.id);
  if(bal<rw.cost){ toast(`积分不够哦，还差 ${fmt(rw.cost-bal)} 分`); return; }
  confirmSheet({
    title:`兑换「${rw.name}」`,
    text: rw.kind==='cash'
      ? `将扣除 ${fmt(rw.cost)} 分，换 ${fmt(rw.money||0)} 元零钱；兑换后剩余 ${fmt(bal-rw.cost)} 分。`

        <button type="button" id="qrMPlus">＋</button>
      </div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:7px;line-height:1.6">填了会在记录里标注「应给 ¥X」，方便当面结清</div>

    <button class="btn-primary" id="qrOk">确认兑换</button>
    <button class="btn-ghost" id="qrNo">取消</button>
  `,r=>{
    const nameI=r.querySelector('#qrName'), numI=r.querySelector('#qrNum'), moneyI=r.querySelector('#qrMoney');
    let emoji='🎁';

    const markNum=()=>r.querySelectorAll('[data-q],[id=qrAll]').forEach(c=>{
      const v=c.dataset.q?+c.dataset.q:bal;
      c.classList.toggle('on', round2(v)===round2(parseFloat(numI.value)));
    });
    const setNum=v=>{ numI.value=fmt(round2(Math.max(0.5,Math.min(bal||9999,v)))); markNum(); };
    markNum();
    r.querySelectorAll('[data-q]').forEach(c=>c.onclick=()=>setNum(+c.dataset.q));
    r.querySelector('#qrAll').onclick=()=>setNum(bal);
    numI.addEventListener('blur',()=>setNum(parseFloat(numI.value)||bal));
    r.querySelector('#qrMinus').onclick=()=>setNum((parseFloat(numI.value)||0.5)-0.5);
    r.querySelector('#qrPlus').onclick =()=>setNum((parseFloat(numI.value)||0.5)+0.5);

    r.querySelectorAll('[data-pn]').forEach(c=>c.onclick=()=>{
      nameI.value=c.dataset.pn; emoji=c.dataset.pe;
      r.querySelectorAll('[data-pn]').forEach(x=>x.classList.toggle('on',x===c));
    });

    const setMoney=v=>{ moneyI.value=fmt(round2(Math.max(0,Math.min(9999,v)))); };
    r.querySelector('#qrMMinus').onclick=()=>setMoney((parseFloat(moneyI.value)||0.5)-0.5);
    r.querySelector('#qrMPlus').onclick =()=>setMoney((parseFloat(moneyI.value)||0)+0.5);

    r.querySelector('#qrNo').onclick=closeSheet;
    r.querySelector('#qrOk').onclick=()=>{
      const name=nameI.value.trim();
      let n=parseFloat(numI.value);
      const money=parseFloat(moneyI.value);
      if(!name){ toast('请填写兑换内容'); return; }
      if(isNaN(n)||n<=0){ toast('请填写正确分数'); return; }
      n=round2(Math.round(n*2)/2);
      if(n>bal){ toast(`积分不够，最多可兑 ${fmt(bal)} 分`); return; }
      confirmSheet({
        title:'确认兑换？',
        text:`「${name}」将扣除 ${fmt(n)} 分${(!isNaN(money)&&money>0)?`，换 ${fmt(money)} 元`:''}，兑换后剩余 ${fmt(bal-n)} 分。`,
        okText:'确认兑换',
        onOk:()=>{
          const rec={kidId:kid.id,delta:-n,reason:name,type:'redeem',emoji};
          if(!isNaN(money)&&money>0) rec.cash=round2(money);
          addLog(rec);
          closeAllSheets();
          toast(`已兑换，扣 ${fmt(n)} 分`);
          render();
        }
      });
    };
  });
}

/* ============================================================
   记录页
   ============================================================ */
function renderLog(v,left,right,title){
  title.textContent='积分记录';
  const kid=kidById(state.kidId);
  const filters=[{k:'all',n:'全部'},{k:'up',n:'加分'},{k:'down',n:'扣分/兑换'}];
  let logs=DB.logs.slice().sort((a,b)=>b.ts-a.ts);
  if(state.logFilter==='up')   logs=logs.filter(l=>l.delta>0);
  if(state.logFilter==='down') logs=logs.filter(l=>l.delta<0);

  // 按天分组
  const groups={};
  logs.forEach(l=>{
    const d=new Date(l.ts);
    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const label = d.toDateString()===new Date().toDateString() ? '今天'
      : d.toDateString()===new Date(Date.now()-86400000).toDateString() ? '昨天'
      : `${d.getMonth()+1}月${d.getDate()}日`;
    (groups[key]=groups[key]||{label,items:[],sum:0}).items.push(l);
    groups[key].sum+=l.delta;
  });

  v.innerHTML=`
    ${DB.kids.length>1?`<div class="chips" style="margin:2px 0 2px">
      ${DB.kids.map(k=>`<button class="chip ${k.id===state.kidId?'on':''}" onclick="switchKidLog('${k.id}')">${esc(k.name)} <b style="opacity:.7">${fmt(balanceOf(k.id))}</b></button>`).join('')}
    </div>`:''}
    <div class="chips" style="margin:12px 0 4px">
      ${filters.map(f=>`<button class="chip ${state.logFilter===f.k?'on':''}" onclick="setLogFilter('${f.k}')">${f.n}</button>`).join('')}
    </div>
    ${Object.values(groups).map(g=>`
      <div class="sec-title" style="margin:16px 2px 8px">${g.label}
        <span style="margin-left:auto;font-size:12px;font-weight:800;color:${g.sum>=0?'var(--up)':'var(--down)'}">${g.sum>=0?'+':''}${fmt(g.sum)}</span>
      </div>
      ${g.items.map(l=>recItem(l,true)).join('')}
    `).join('')}
    ${logs.length===0?`<div class="empty" style="padding-top:60px"><span class="e-ic">📋</span>${kid?esc(kid.name)+' 还没有相关记录':'暂无记录'}</div>`:''}
  `;
  // 长按删除记录
  v.querySelectorAll('.rec-item').forEach((el,i)=>{
    const id=logs[i] && logs[i].id; if(!id) return;
    let timer=null;
    const start=()=>{ timer=setTimeout(()=>{
      confirmSheet({title:'删除这条记录？',text:'删除后积分会相应回滚。',okText:'删除',danger:true,onOk:()=>{
        DB.logs=DB.logs.filter(l=>l.id!==id); save(); render(); toast('已删除');
      }});
    },550); };
    const end=()=>clearTimeout(timer);
    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',end); el.addEventListener('touchmove',end);
    el.addEventListener('mousedown',start); el.addEventListener('mouseup',end); el.addEventListener('mouseleave',end);
  });
}
function switchKidLog(id){ state.kidId=id; DB.activeKid=id; save(); render(); }
function setLogFilter(f){ state.logFilter=f; render(); }

function recItem(l,full){
  const up=l.delta>=0;
  return `<div class="rec-item">
    <div class="rec-ic ${up?'':'down'}">${esc(l.emoji||(up?'+':'-'))}</div>
    <div class="rec-main">
      <div class="rec-t">${esc(l.reason)}</div>
      <div class="rec-m">
        ${DB.kids.length>1?`<span>${esc((kidById(l.kidId)||{}).name||'')}</span>`:''}
        <span>${fmtTime(l.ts)}</span>
        <span>${l.type==='task'?'日常打卡':l.type==='redeem'?'兑换':'手动调整'}</span>
        ${l.cash?`<span class="cash-tag">应给 ¥${fmt(l.cash)}</span>`:''}
      </div>
    </div>
    <div class="rec-v ${up?'up':'down'}">${up?'+':''}${fmt(l.delta)}</div>
  </div>`;
}

    save(); render(); toast('已删除');
  }});
}
function askDeleteTask(t){
  confirmSheet({title:'删除任务「'+t.name+'」？',text:'已产生的积分记录不会被删除。',okText:'删除',danger:true,onOk:()=>{
    DB.tasks=DB.tasks.filter(x=>x.id!==t.id); save(); render(); toast('已删除');
  }});
}
function askDeleteReward(r){
  confirmSheet({title:'删除兑换项「'+r.name+'」？',text:'已产生的兑换记录不会被删除。',okText:'删除',danger:true,onOk:()=>{
    DB.rewards=DB.rewards.filter(x=>x.id!==r.id); save(); render(); toast('已删除');
  }});
}

let tmpPhoto='';
function openKidForm(id){

    <h3>${k?'编辑宝贝':'新建宝贝'}</h3>

        <div>
          <button class="mini-btn" id="avPick">选择照片</button>
          ${k?'<button class="mini-btn" id="avClear" style="background:#F6F2ED;color:var(--ink-3);margin-left:6px">清除</button>':''}
        </div>
      </div>

      <label>性别</label>
      <div class="chips" id="genderChips">
        <button type="button" class="chip ${(!k||k.gender==='boy')?'on':''}" data-g="boy">👦 男孩</button>
        <button type="button" class="chip ${(k&&k.gender==='girl')?'on':''}" data-g="girl">👧 女孩</button>
      </div>

  `,r=>{

    r.querySelector('#kName').value = k?k.name:'';
    r.querySelector('#kAge').value  = k&&k.age?k.age:'';

    r.querySelector('#avPick').onclick=()=>file.click();
    file.onchange=()=>{
      const f=file.files[0]; if(!f) return;
      // 压缩到 360px，避免 localStorage 撑爆
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=360, sc=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          tmpPhoto=c.toDataURL('image/jpeg',0.82);
          prev.innerHTML=`<img src="${tmpPhoto}">`;
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(f);
    };
    const clr=r.querySelector('#avClear');
    if(clr) clr.onclick=()=>{ tmpPhoto=''; prev.innerHTML= gender==='girl'?'👧':'👦'; };

    r.querySelector('#ageMinus').onclick=()=>{ const a=r.querySelector('#kAge'); a.value=Math.max(0,(+a.value||0)-1); };
    r.querySelector('#agePlus').onclick =()=>{ const a=r.querySelector('#kAge'); a.value=Math.min(25,(+a.value||0)+1); };

    r.querySelectorAll('#genderChips .chip').forEach(b=>b.onclick=()=>{
      gender=b.dataset.g;
      r.querySelectorAll('#genderChips .chip').forEach(x=>x.classList.toggle('on',x===b));
      if(!tmpPhoto) prev.innerHTML = gender==='girl'?'👧':'👦';
    });

    r.querySelector('#kSave').onclick=()=>{
      const name=r.querySelector('#kName').value.trim();
      const age=parseInt(r.querySelector('#kAge').value,10)||0;
      if(!name){ toast('请填写姓名'); return; }
      if(k){
        Object.assign(k,{name,age,gender,photo:tmpPhoto});
      }else{
        const nk={id:uid(),name,age,gender,photo:tmpPhoto,createdAt:Date.now()};
        DB.kids.push(nk);
        if(!state.kidId) state.kidId=nk.id;
      }
      save(); closeSheet(); toast('已保存'); render();
    };
    const del=r.querySelector('#kDel');
    if(del) del.onclick=()=>{
      confirmSheet({title:'删除「'+k.name+'」？',text:'TA 的积分和记录会一起被删除，无法恢复。',okText:'删除',danger:true,onOk:()=>{
        DB.kids=DB.kids.filter(x=>x.id!==k.id);
        DB.logs=DB.logs.filter(l=>l.kidId!==k.id);
        if(state.kidId===k.id) state.kidId=(DB.kids[0]||{}).id||'';
        save(); closeAllSheets(); render(); toast('已删除');
      }});
    };
    const no=r.querySelector('#kNo'); if(no) no.onclick=closeSheet;
  });
}

/* ============================================================
   数据导入导出
   ============================================================ */
function backupJSON(){
  const d=new Date();
  return JSON.stringify(DB,null,2);
}
function backupName(){
  const d=new Date();
  return `成长积分备份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
}
async function exportData(){
  const json=backupJSON();
  const name=backupName();
  // 优先用系统分享面板（可存到"文件"、微信、隔空投送等）
  try{
    if(navigator.canShare && navigator.canShare({files:[new File([json],name,{type:'application/json'})]})){
      await navigator.share({files:[new File([json],name,{type:'application/json'})],title:name});
      toast('已调出分享，可存到"文件"或发给自己');
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; } // 用户取消分享
  // 退化为下载
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('备份已下载，可在"文件"App 中查看');
}
/* 复制备份到剪贴板 */
async function copyBackup(){
  const json=backupJSON();
  try{

    toast('备份已复制到剪贴板（'+Math.round(json.length/1024)+' KB）');

function applyBackup(d){
  if(!d || !Array.isArray(d.kids)) throw 0;
  DB={kids:d.kids||[],tasks:d.tasks||[],rewards:d.rewards||[],logs:d.logs||[],activeKid:(d.kids[0]||{}).id||'',seeded:true};
  state.kidId=DB.activeKid; save(); closeAllSheets(); go('home'); toast('导入成功');
}

/* ============================================================
   刷新 / 检查更新（主屏模式没有下拉刷新，靠它）
   ============================================================ */
const APP_VERSION = 'v2.3';   // 每次发布新版本时改这里（改了客户端就会提示更新）

/* ---------- 检查更新 ---------- */
let checking=false;
async function checkUpdate(fromButton){
  if(checking) return;
  checking=true;
  spinReloadBtn();

  const remote = await fetchRemoteVersion();
  checking=false;

  if(!remote){
    // 取不到（离线/跨域），退化为直接重新加载
    confirmSheet({
      title:'重新加载页面',
      text:'积分数据已保存在本机，重新加载不会丢失。如果加载后界面没变，请用「强制更新」。',
      okText:'重新加载',
      onOk:()=>doReload()
    });
    return;
  }
  if(remote !== APP_VERSION){
    confirmSheet({
      title:'发现新版本 ' + remote,
      text:`当前 ${APP_VERSION}，最新 ${remote}。立即更新即可使用新版，你的积分数据不会丢失。`,
      okText:'立即更新',
      onOk:()=>doReload()
    });
  }else{
    // 版本号相同也要真正刷新：内容可能已更新但发布时漏改了版本号，
    // 这里强制重新从网络拉取最新页面，保证「刷新」按钮永远有效。
    doReload();
  }
}

/* 拉取线上最新版本号 */
async function fetchRemoteVersion(){
  try{
    const res = await fetch(location.pathname + '?_v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return '';
    const html = await res.text();
    const m = html.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    return m ? m[1] : '';
  }catch(e){ return ''; }
}

function spinReloadBtn(){
  const btn=document.getElementById('reloadBtn');
  if(!btn) return;
  btn.style.transition='transform .6s ease';
  btn.style.transform='rotate(360deg)';
  setTimeout(()=>{ btn.style.transition=''; btn.style.transform=''; },640);
}

/* ---------- 刷新（附版本参数，绕过缓存） ---------- */
function doReload(){
  try{ save(); }catch(e){}
  const u=new URL(location.href);
  u.searchParams.set('_r', Date.now());
  u.searchParams.set('_v', APP_VERSION);
  location.replace(u.toString());
}

/* ---------- 强制更新：用新网址重开，确保拿不到旧缓存 ---------- */
function hardReloadHelp(){
  confirmSheet({
    title:'强制更新',
    text:'会关闭缓存重新打开应用，积分数据保存在本机，不会丢失。',
    okText:'立即强制更新',
    onOk:()=>{
      try{ save(); }catch(e){}
      const u=new URL(location.href);
      u.searchParams.set('_r', Date.now() + Math.floor(Math.random()*9999));
      u.searchParams.set('_v', APP_VERSION);
      u.searchParams.set('fresh','1');
      location.href = u.toString();
    }
  });
}

/* ---------- 启动时静默检查一次：有新版自动提醒 ---------- */
(async function autoCheckOnOpen(){
  // 每次冷启动最多查一次
  const last = sessionStorage.getItem('gp_checked');
  sessionStorage.setItem('gp_checked','1');
  if(last) return;              // 同一会话内不重复打扰
  await new Promise(r=>setTimeout(r,900));  // 等界面稳定
  const remote = await fetchRemoteVersion();
  if(!remote || remote === APP_VERSION) return;
  // 顶部提示条，不打断操作
  showUpdateBar(remote);
})();

function showUpdateBar(remote){
  if(document.getElementById('updBar')) return;
  const bar=document.createElement('div');
  bar.id='updBar';
  bar.innerHTML=`<span>🎉 有新版本 ${remote}</span>
    <button id="updGo">立即更新</button>
    <button id="updClose">✕</button>`;
  Object.assign(bar.style,{
    position:'absolute',left:'12px',right:'12px',top:'calc(env(safe-area-inset-top,0px) + 8px)',
    zIndex:'300',display:'flex',alignItems:'center',gap:'8px',
    padding:'10px 12px',borderRadius:'14px',
    background:'linear-gradient(135deg,#5B7CFA,#3F5BE0)',
    color:'#fff',fontSize:'13px',fontWeight:'700',
    boxShadow:'0 8px 22px rgba(63,91,224,.35)',
    animation:'fi .3s ease'
  });
  bar.querySelector('#updGo').style.cssText='margin-left:auto;background:#fff;color:#3F5BE0;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:800;';
  bar.querySelector('#updClose').style.cssText='color:#fff;opacity:.7;font-size:15px;padding:0 2px;';
  document.getElementById('phone').appendChild(bar);
  bar.querySelector('#updGo').onclick=doReload;
  bar.querySelector('#updClose').onclick=()=>bar.remove();
}

/* ============================================================
   离线缓存（Service Worker）：装过一次后，无网也能打开 APP
   ============================================================ */
/* 注意：托管服务对子资源（sw.js / png 等）一律返回 403，
   所以 Service Worker 不能用外部文件注册，改用 Blob 内联注册。
   页面本身已是单文件全内联，缓存根文档即可离线打开。 */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol!=='https:' && location.hostname!=='localhost') return;

  const SW_SRC = `
    const CACHE='jifenbao-inline-v1';
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('activate',e=>{
      e.waitUntil(caches.keys().then(ks=>Promise.all(
        ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))
      )).then(()=>self.clients.claim()));
    });
    self.addEventListener('message',e=>{ if(e.data==='SKIP_WAITING') self.skipWaiting(); });
    self.addEventListener('fetch',e=>{
      const req=e.request;
      if(req.method!=='GET') return;
      if(req.mode!=='navigate' && !req.url.startsWith(self.location.origin)) return;
      e.respondWith(
        fetch(req).then(res=>{
          const cp=res.clone();
          caches.open(CACHE).then(c=>c.put(req,cp)).catch(()=>{});
          return res;
        }).catch(()=>caches.match(req).then(r=>r||caches.match('./')))
      );
    });
  `;

  window.addEventListener('load',()=>{
    let url;
    try{
      url = URL.createObjectURL(new Blob([SW_SRC],{type:'text/javascript'}));
    }catch(_){ return; }

    navigator.serviceWorker.register(url).then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(()=>{
      /* 内联注册不被支持时静默降级：APP 依然可用，只是没有离线缓存 */
    });
  });
})();

/* ============================================================
   启动
   ============================================================ */
document.querySelectorAll('#tabbar button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.tab===state.tab && state.tab==='home'){ $('#view').scrollTo({top:0,behavior:'smooth'}); return; }
    state.tab=b.dataset.tab; render();
  };
});

// 阻止 iOS 双击缩放
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouch<=300){ e.preventDefault(); }
  lastTouch=now;
},{passive:false});

render();
</script>
</body>

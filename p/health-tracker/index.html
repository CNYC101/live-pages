<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0EA5A4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>健康登记 · 体重体围</title>
<style>
:root{
  --primary:#0EA5A4;        /* 主色 清新青绿 */
  --primary-d:#0B8A89;
  --primary-l:#5EEAD4;
  --blue:#2E9BE0;           /* 辅助 天蓝（体脂率线） */
  --bg:#F1F6F7;             /* 浅底 */
  --card:#FFFFFF;
  --ink:#123B3C;            /* 深墨绿字 */
  --sub:#6B8B8C;            /* 次要字 */
  --line:#E2EDED;
  --ok:#16A34A;
  --warn:#E8912B;
  --danger:#E04A3F;
  --thin:#F7FBFB;
  --shadow:0 6px 20px rgba(14,165,164,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  overscroll-behavior-y:none;
}
#app{max-width:520px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}
/* 顶部标题条 */
.topbar{
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
  background:linear-gradient(135deg,#0EA5A4 0%,#2E9BE0 100%);
  color:#fff;display:flex;align-items:center;justify-content:space-between;
  border-radius:0 0 20px 20px;box-shadow:var(--shadow);
}
.topbar .tb-title{font-size:18px;font-weight:800;letter-spacing:.5px;}
.topbar .tb-user{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px;max-width:52%;justify-content:flex-end;}
.topbar .tb-user .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85;}
/* 内容滚动区 */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(84px + var(--safe-b));}
.scroll::-webkit-scrollbar{display:none;}
/* 底部 Tab */
.tabbar{position:absolute;left:0;right:0;bottom:0;padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--line);}
.tb-row{display:flex;}
.tabbar button{flex:1;border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:11px;cursor:pointer;transition:transform .1s;}
.tabbar button .ic{font-size:20px;line-height:1;}
.tabbar button.on{color:var(--primary);font-weight:700;}
.tabbar button:active{transform:scale(.94);}
/* 卡片 */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.sec-title{font-size:13px;font-weight:800;color:var(--primary-d);margin:2px 2px 12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--primary);}
.muted{color:var(--sub);font-size:12px;}
/* 大数字展示 */
.bignums{display:flex;gap:10px;}
.bignum{flex:1;background:var(--thin);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;}
.bignum .v{font-size:22px;font-weight:800;color:var(--ink);line-height:1.1;}
.bignum .u{font-size:11px;color:var(--sub);font-weight:600;}
.bignum .k{font-size:11px;color:var(--sub);margin-top:4px;}
.chip-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
/* 表单 */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600;}
.field .lb-req{color:var(--danger);margin-left:2px;}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
input::placeholder,textarea::placeholder{color:#B7C9C9;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
/* 按钮 */
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#0EA5A4,#2E9BE0);color:#fff;box-shadow:var(--shadow);}
.btn-ghost{background:var(--thin);color:var(--primary-d);border:1.5px solid var(--line);}
.btn-danger{background:#FCEBE9;color:var(--danger);}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:10px;}
/* 筛选 chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:6px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:13px;color:var(--sub);cursor:pointer;font-weight:600;}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
/* 图表 */
.chart-wrap{position:relative;width:100%;height:210px;}
canvas{display:block;width:100%;height:100%;}
.legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--sub);}
.legend .lg{display:flex;align-items:center;gap:6px;}
.legend .sw{width:14px;height:3px;border-radius:2px;}
/* 记录列表 */
.rec{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
.rec:last-child{border-bottom:0;}
.rec .r-main{flex:1;}
.rec .r-v{font-size:17px;font-weight:800;color:var(--ink);}
.rec .r-v .rv-u{font-size:11px;color:var(--sub);font-weight:600;margin-left:2px;}
.rec .r-sub{font-size:11px;color:var(--sub);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;}
.rec .r-note{font-size:11px;color:var(--primary-d);background:var(--thin);padding:1px 8px;border-radius:8px;display:inline-block;margin-top:4px;max-width:100%;}
.rec .r-arrow{color:#C6D6D6;font-size:20px;}
.delta-down{color:var(--ok);} .delta-up{color:var(--danger);}
/* 进度条 */
.prog{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#0EA5A4,#2E9BE0);border-radius:6px;}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);margin-top:8px;}
.prog-row b{color:var(--ink);font-size:14px;}
/* 空状态 */
.empty{text-align:center;padding:28px 10px;color:var(--sub);font-size:13px;}
.empty .em-ic{font-size:38px;opacity:.5;margin-bottom:8px;}
/* 用户列表 */
.ulist{display:flex;flex-direction:column;gap:10px;}
.ucard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--thin);border:1.5px solid var(--line);cursor:pointer;}
.ucard.on{border-color:var(--primary);background:#EAFBF9;}
.ucard .uav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0EA5A4,#2E9BE0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
.ucard .un{font-weight:700;font-size:15px;}
.ucard .um{font-size:11px;color:var(--sub);margin-top:2px;}
.ucard .ucheck{margin-left:auto;color:var(--primary);font-size:18px;}
/* FAB */
.fab{position:absolute;right:calc(50% - 260px + 18px);bottom:calc(96px + var(--safe-b));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#0EA5A4,#2E9BE0);color:#fff;border:0;font-size:26px;box-shadow:0 8px 18px rgba(14,165,164,.4);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;}
@media (max-width:540px){.fab{right:18px;}}
/* 弹层 sheet */
.mask{position:fixed;inset:0;background:rgba(9,40,40,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:520px;margin:0 auto;}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .25s;z-index:50;box-shadow:0 -6px 30px rgba(0,0,0,.12);max-height:86vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet .sh-title{font-size:17px;font-weight:800;margin-bottom:14px;text-align:center;position:relative;}
.sheet .sh-close{position:absolute;right:0;top:0;color:var(--sub);font-size:20px;cursor:pointer;}
/* toast */
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%) translateY(-16px);background:rgba(18,59,60,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:80%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
textarea.bk{height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace;}
.ihint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5;}
.bmi-legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.bmi-legend .bl{flex:1;min-width:70px;text-align:center;font-size:10px;padding:5px 2px;border-radius:8px;background:var(--thin);color:var(--sub);}
.bmi-legend .bl.on{color:#fff;font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-title" id="tbTitle">健康登记</div>
    <div class="tb-user" id="tbUser"></div>
  </div>
  <div class="scroll" id="view"></div>
  <nav class="tabbar">
    <div class="tb-row">
      <button class="on" data-tab="home"><span class="ic">🏠</span>首页</button>
      <button data-tab="weight"><span class="ic">⚖️</span>体重</button>
      <button data-tab="girth"><span class="ic">📏</span>体围</button>
      <button data-tab="me"><span class="ic">👤</span>我的</button>
    </div>
  </nav>
  <button class="fab" id="fab" style="display:none">+</button>
  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ========================= 数据层 ========================= */
const KEY='healthLog_v1';
const METRICS=[
  {k:'waist',n:'腰围'},{k:'chest',n:'胸围'},{k:'hip',n:'臀围'},
  {k:'thigh',n:'大腿围'},{k:'calf',n:'小腿围'},{k:'arm',n:'手臂围'}
];
let DB=load();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return {users:[],activeId:''};
    const d=JSON.parse(raw);
    if(!d.users) d.users=[];
    return d;
  }catch(e){ return {users:[],activeId:''}; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('保存失败：存储空间不足'); } }
function uid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function activeUser(){ return DB.users.find(u=>u.id===DB.activeId)||null; }

/* BMI */
function bmi(wKg,hCm){ if(!wKg||!hCm) return null; const m=hCm/100; return wKg/(m*m); }
function bmiClass(b){
  if(b==null) return null;
  if(b<18.5) return {label:'偏瘦',color:'#2E9BE0',bg:'#E7F3FC'};
  if(b<24)   return {label:'正常',color:'#16A34A',bg:'#E6F6EC'};
  if(b<28)   return {label:'超重',color:'#E8912B',bg:'#FCF1E2'};
  return {label:'肥胖',color:'#E04A3F',bg:'#FCEBE9'};
}

/* 记录时间工具 */
function fmtDate(ts){ const d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return fmtDate(ts)+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function toInput(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }

/* 最近一条 */
function lastWeight(u){ return u.weightRecords.length? u.weightRecords[u.weightRecords.length-1]:null; }
function firstWeight(u){ return u.weightRecords.length? u.weightRecords[0]:null; }
function lastGirth(u,k){ for(let i=u.girthRecords.length-1;i>=0;i--){ const r=u.girthRecords[i]; if(r[k]!=null&&r[k]!=='') return r; } return null; }

/* 按时间窗口过滤 */
const RANGE_DAYS={week:7, month:30, half:182, year:365, all:99999};
function inRange(records,range){
  const days=RANGE_DAYS[range]||99999; const start=Date.now()-days*86400000;
  return records.filter(r=>r.t>=start).sort((a,b)=>a.t-b.t);
}

/* ========================= 图表引擎（原生 canvas） ========================= */
function drawChart(canvas,series,opt){
  opt=opt||{};
  const dpr=window.devicePixelRatio||1;
  const cssW=canvas.clientWidth||canvas.parentElement.clientWidth||300;
  const cssH=canvas.clientHeight||canvas.parentElement.clientHeight||210;
  canvas.width=cssW*dpr; canvas.height=cssH*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  const padL=38,padR=series.some(s=>s.axis==='right')?40:14,padT=14,padB=26;
  const W=cssW-padL-padR, H=cssH-padT-padB;

  // 收集点
  let pts=[]; series.forEach(s=>s.data.forEach(p=>pts.push(p)));
  if(!pts.length){
    ctx.fillStyle='#B7C9C9'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('该时间段暂无数据',cssW/2,cssH/2); return;
  }
  let minT=Infinity,maxT=-Infinity;
  pts.forEach(p=>{minT=Math.min(minT,p.t);maxT=Math.max(maxT,p.t);});
  if(minT===maxT){minT-=43200000;maxT+=43200000;}

  // 左轴域
  let lvals=[]; series.filter(s=>s.axis!=='right').forEach(s=>s.data.forEach(p=>lvals.push(p.v)));
  if(opt.goalLeft!=null) lvals.push(opt.goalLeft);
  let lmin=Math.min(...lvals), lmax=Math.max(...lvals);
  if(lmin===lmax){lmin-=1;lmax+=1;}
  const lpad=(lmax-lmin)*0.12; lmin-=lpad; lmax+=lpad;
  // 右轴域
  let rvals=[]; series.filter(s=>s.axis==='right').forEach(s=>s.data.forEach(p=>rvals.push(p.v)));
  let rmin=0,rmax=1,hasR=rvals.length>0;
  if(hasR){ rmin=Math.min(...rvals); rmax=Math.max(...rvals); if(rmin===rmax){rmin-=2;rmax+=2;} const rp=(rmax-rmin)*0.2; rmin=Math.max(0,rmin-rp); rmax+=rp; }

  const X=t=>padL+(t-minT)/(maxT-minT)*W;
  const YL=v=>padT+(lmax-v)/(lmax-lmin)*H;
  const YR=v=>padT+(rmax-v)/(rmax-rmin)*H;
  const dec=opt.dec!=null?opt.dec:1;

  // 网格 + 左轴标签
  ctx.strokeStyle='#EDF4F4'; ctx.lineWidth=1; ctx.fillStyle='#9BB6B6'; ctx.font='10px sans-serif';
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y=padT+H/ticks*i;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+W,y);ctx.stroke();
    const val=lmax-(lmax-lmin)/ticks*i;
    ctx.textAlign='right'; ctx.fillText(val.toFixed(dec),padL-6,y+3);
    if(hasR){ const rv=rmax-(rmax-rmin)/ticks*i; ctx.textAlign='left'; ctx.fillText(rv.toFixed(0)+'%',padL+W+6,y+3); }
  }
  // x 轴时间标签
  ctx.fillStyle='#9BB6B6'; ctx.textAlign='left'; ctx.fillText(fmtDate(minT),padL,cssH-8);
  ctx.textAlign='right'; ctx.fillText(fmtDate(maxT),padL+W,cssH-8);

  // 目标虚线
  if(opt.goalLeft!=null){
    const gy=YL(opt.goalLeft);
    ctx.strokeStyle=opt.goalColor||'#0EA5A4'; ctx.setLineDash([5,4]); ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(padL+W,gy);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=opt.goalColor||'#0EA5A4'; ctx.textAlign='left'; ctx.font='10px sans-serif';
    ctx.fillText('目标'+opt.goalLeft.toFixed(dec),padL+2,gy-4);
  }

  // 画每条线
  series.forEach(s=>{
    if(!s.data.length) return;
    const Y = s.axis==='right'?YR:YL;
    const d=[...s.data].sort((a,b)=>a.t-b.t);
    ctx.strokeStyle=s.color; ctx.lineWidth=2.2; ctx.lineJoin='round';
    ctx.beginPath(); d.forEach((p,i)=>{ const x=X(p.t),y=Y(p.v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    // 面积填充（仅主线）
    if(s.fill){ ctx.lineTo(X(d[d.length-1].t),padT+H); ctx.lineTo(X(d[0].t),padT+H); ctx.closePath();
      ctx.fillStyle=s.fill; ctx.fill(); }
    // 点
    d.forEach(p=>{ ctx.beginPath();ctx.arc(X(p.t),Y(p.v),p===d[d.length-1]?4:3,0,7);
      ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=s.color;ctx.stroke(); });
  });
}

/* ========================= 状态 & 渲染框架 ========================= */
let state={tab:'home', weightRange:'week', girthRange:'week', girthMetric:'waist'};
const $=s=>document.querySelector(s);
const view=$('#view');

function render(){
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const u=activeUser();
  $('#tbUser').innerHTML=u?`<span class="dot"></span>${esc(u.name)}`:'';
  $('#fab').style.display=(u&&(state.tab==='weight'||state.tab==='girth'))?'flex':'none';
  $('#fab').onclick=()=>state.tab==='weight'?openWeightForm():openGirthForm();
  view.innerHTML='';
  if(state.tab==='home') renderHome();
  else if(state.tab==='weight') renderWeight();
  else if(state.tab==='girth') renderGirth();
  else renderMe();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ========================= 首页 ========================= */
function renderHome(){
  const u=activeUser();
  if(!u){
    view.innerHTML=`<div class="empty" style="margin-top:40px">
      <div class="em-ic">🌿</div><div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px">还没有健康档案</div>
      <div style="margin-bottom:18px">新建一个用户开始记录体重与体围吧</div>
      <button class="btn btn-primary" style="max-width:220px;margin:0 auto" onclick="openNewUser()">＋ 新建用户</button></div>`;
    return;
  }
  const lw=lastWeight(u), b=bmi(lw?lw.w:null,u.height), bc=bmiClass(b);
  const html=[];
  // 概览
  html.push(`<div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div class="ucard on" style="padding:0;border:0;background:none;flex:1">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="uav">${esc(u.name[0]||'我')}</div>
          <div><div class="un">${esc(u.name)}</div><div class="um">身高 ${u.height||'—'} cm · 共 ${u.weightRecords.length} 条体重 / ${u.girthRecords.length} 条体围</div></div>
        </div>
      </div>
      ${DB.users.length>1?`<button class="btn btn-ghost btn-sm" onclick="openSwitch()">切换</button>`:''}
    </div>
    <div class="bignums">
      <div class="bignum"><div class="v">${lw?lw.w.toFixed(1):'—'}<span class="u"> kg</span></div><div class="k">当前体重</div></div>
      <div class="bignum"><div class="v">${b!=null?b.toFixed(1):'—'}</div><div class="k">BMI ${bc?`<span class="chip-tag" style="background:${bc.bg};color:${bc.color}">${bc.label}</span>`:''}</div></div>
    </div>`);
  // BMI 区间图例
  if(b!=null){
    const bars=[['偏瘦','#E7F3FC','#2E9BE0'],['正常','#E6F6EC','#16A34A'],['超重','#FCF1E2','#E8912B'],['肥胖','#FCEBE9','#E04A3F']];
    const idx=b<18.5?0:b<24?1:b<28?2:3;
    html.push(`<div class="bmi-legend">${bars.map((x,i)=>`<div class="bl" style="${i===idx?'background:'+x[2]+';color:#fff;font-weight:700':'background:'+x[1]+';color:'+x[2]}">${x[0]}</div>`).join('')}</div>`);
  }
  html.push(`</div>`);

  // 目标进度
  if(u.targetWeight&&lw){
    html.push(progressCard('体重目标',u.targetWeight,lw.w,'kg'));
  }
  // 关键体围摘要
  const gSum=METRICS.map(m=>{const r=lastGirth(u,m.k);return r?`<div class="bignum"><div class="v">${(+r[m.k]).toFixed(1)}<span class="u"> cm</span></div><div class="k">${m.n}</div></div>`:'';}).filter(Boolean);
  if(gSum.length){

  }

  html.push(`<div class="card"><div class="sec-title">我的档案（${DB.users.length}）</div><div class="ulist">`);
  DB.users.forEach(x=>{
    html.push(`<div class="ucard ${x.id===u.id?'on':''}" onclick="switchUser('${x.id}')">
      <div class="uav">${esc(x.name[0]||'我')}</div>
      <div><div class="un">${esc(x.name)}</div><div class="um">BMI ${bmi(lastWeight(x)?lastWeight(x).w:null,x.height)!=null?bmi(lastWeight(x)?lastWeight(x).w:null,x.height).toFixed(1):'—'} · ${x.weightRecords.length} 条记录</div></div>
      ${x.id===u.id?'<div class="ucheck">✓</div>':''}</div>`);
  });
  html.push(`</div><button class="btn btn-ghost" style="margin-top:12px" onclick="openNewUser()">＋ 新建用户</button></div>`);

  view.innerHTML=html.join('');

function progressCard(title,target,cur,unit,startOverride){
  const diff=cur-target; const abs=Math.abs(diff);
  // 进度：以“起始值→目标”为区间；未传起始值时体重取首条记录
  let start=startOverride;
  if(start==null&&unit==='kg'){ const fw=firstWeight(activeUser()); if(fw) start=fw.w; }
  let prog=0;
  if(start!=null&&start!==target&&unit==='kg'){ const p=(start-cur)/(start-target); prog=Math.max(0,Math.min(1,p)); }
  else if(start!=null&&start!==target){ const p=(start-cur)/(start-target); prog=Math.max(0,Math.min(1,p)); }
  const done=abs<0.05;
  let msg;
  if(done) msg=`🎉 已达成目标 ${target}${unit}`;
  else if(diff>0) msg=`还需减 <b style="color:var(--danger)">${abs.toFixed(1)}${unit}</b> 达标`;
  else msg=`还需增 <b style="color:var(--ok)">${abs.toFixed(1)}${unit}</b> 达标`;
  return `<div class="card"><div class="sec-title">${title}</div>
    <div class="prog-row"><span>当前 <b>${cur.toFixed(1)}${unit}</b></span><span>目标 <b>${target.toFixed(1)}${unit}</b></span></div>
    <div class="prog"><i style="width:${(prog*100).toFixed(0)}%"></i></div>
    <div class="prog-row"><span>${msg}</span><span>${(prog*100).toFixed(0)}%</span></div></div>`;
}

function delUser(id){
  const u=DB.users.find(x=>x.id===id);
  confirmSheet('删除档案？',`将永久删除「${u.name}」及其所有体重、体围记录。建议先导出备份。`,'确认删除',()=>{
    DB.users=DB.users.filter(x=>x.id!==id);
    if(DB.activeId===id)DB.activeId=DB.users[0]?DB.users[0].id:'';
    save();render();toast('已删除');
  });
}

/* 切换用户 */
function openSwitch(){
  openSheet(`<div class="sh-title">切换档案<span class="sh-close" onclick="closeSheet()">✕</span></div>
    <div class="ulist">${DB.users.map(x=>`<div class="ucard ${x.id===DB.activeId?'on':''}" onclick="switchUser('${x.id}')">
      <div class="uav">${esc(x.name[0]||'我')}</div><div><div class="un">${esc(x.name)}</div><div class="um">${x.weightRecords.length} 条体重记录</div></div>
      ${x.id===DB.activeId?'<div class="ucheck">✓</div>':''}</div>`).join('')}</div>
    <button class="btn btn-ghost" style="margin-top:12px" onclick="closeSheet();openNewUser()">＋ 新建用户</button>`);
}
function switchUser(id){DB.activeId=id;save();closeSheet();render();}

/* ========================= 备份 ========================= */
function exportData(){
  const json=JSON.stringify(DB);
  const name='健康备份_'+new Date().toISOString().slice(0,10)+'.json';
  if(navigator.canShare&&navigator.canShare({files:[new File([json],name,{type:'application/json'})]})){
    navigator.share({files:[new File([json],name,{type:'application/json'})],title:name}).catch(()=>backupSheet(json));
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(json).then(()=>{toast('备份内容已复制到剪贴板，去钉钉/备忘录粘贴保存');}).catch(()=>backupSheet(json));
  }else backupSheet(json);
}
function backupSheet(json){
  openSheet(`<div class="sh-title">备份内容<span class="sh-close" onclick="closeSheet()">✕</span></div>
    <textarea class="bk" id="bkArea">${esc(json)}</textarea>
    <div class="ihint">长按全选复制，保存到钉钉/备忘录；下次用「导入恢复」粘贴。</div>
    <button class="btn btn-primary" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('bkArea').value).then(()=>toast('已复制')).catch(()=>toast('请手动长按复制'))">尝试自动复制</button>`);
}
function importSheet(){
  openSheet(`<div class="sh-title">导入恢复<span class="sh-close" onclick="closeSheet()">✕</span></div>
    <input type="file" id="bkFile" accept="application/json,.json" style="margin-bottom:12px">
    <textarea class="bk" id="impArea" placeholder="或在此粘贴之前导出的备份内容…"></textarea>
    <button class="btn btn-primary" style="margin-top:10px" onclick="doImport()">导入（覆盖当前数据）</button>`);
  $('#bkFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$('#impArea').value=rd.result;};rd.readAsText(f);});
}
function doImport(){
  const txt=$('#impArea').value.trim();
  if(!txt){toast('请粘贴或选择备份文件');return;}
  try{const d=JSON.parse(txt);if(!d.users)throw 0;
    confirmSheet('确认导入？',`将覆盖当前全部数据（${d.users.length} 个档案）。`,  '确认导入',()=>{
      DB=d;save();closeSheet();state.tab='home';render();toast('导入成功');});
  }catch(e){toast('备份内容格式不正确');}
}

/* ========================= Sheet / 弹层 ========================= */
function openSheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('show');$('#mask').classList.add('show');}
function closeSheet(){$('#sheet').classList.remove('show');$('#mask').classList.remove('show');}
$('#mask').addEventListener('click',closeSheet);
function confirmSheet(title,text,okText,onOk){
  window._cf=onOk;
  openSheet(`<div class="sh-title">${esc(title)}</div>
    <div class="muted" style="text-align:center;margin-bottom:16px;line-height:1.6">${esc(text)}</div>
    <div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="closeSheet()">取消</button>
    <button class="btn btn-danger" onclick="window._cf&&window._cf()">删除</button></div>`);
  $('#sheet').querySelector('.btn-danger').textContent=okText;
}

/* ========================= Toast ========================= */
let _tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),1800);}

function noUser(){
  view.innerHTML=`<div class="empty" style="margin-top:40px"><div class="em-ic">📭</div><div>还没有档案</div>
    <button class="btn btn-primary" style="max-width:220px;margin:16px auto 0" onclick="openNewUser()">＋ 新建用户</button></div>`;
}

/* ========================= 事件绑定 ========================= */
document.querySelectorAll('#tabbar button').forEach(b=>b.addEventListener('click',()=>{
  if(state.tab==='home'&&b.dataset.tab==='home'){view.scrollTo({top:0,behavior:'smooth'});return;}
  state.tab=b.dataset.tab;render();
}));
window.addEventListener('resize',()=>{ if(state.tab==='weight'||state.tab==='girth') render(); });

/* 首次进入 */
if(DB.users.length&&!DB.activeId)DB.activeId=DB.users[0].id;
render();
</script>
</body>
</html>
